<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教案</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    background: #f0f4ff;
    color: #1f2937;
    font-size: 13px;
    line-height: 1.7;
  }

  /* 顶部封面 */
  .cover {
    background: linear-gradient(135deg, #1a56db 0%, #1e40af 100%);
    color: #fff;
    padding: 20px 16px 16px;
    position: relative;
    overflow: hidden;
  }
  .cover::after {
    content: '';
    position: absolute;
    right: -30px; bottom: -30px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
  .cover-title {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 6px;
    position: relative;
  }
  .cover-tag {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 11px;
    margin-top: 4px;
  }

  /* 主体 */
  .body { padding: 12px 12px 24px; }

  /* 区块卡片 */
  .section {
    background: #fff;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: #1a56db;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-title::before {
    content: '';
    display: inline-block;
    width: 3px; height: 14px;
    background: #1a56db;
    border-radius: 2px;
  }
  .section-text { color: #374151; font-size: 12.5px; }

  /* 学情四格 */
  .grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 4px;
  }
  .dim-card {
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
  }
  .dim-card .dim-label {
    font-weight: 700;
    font-size: 11.5px;
    margin-bottom: 3px;
  }
  .dim-known   { background: #dcfce7; } .dim-known .dim-label   { color: #166534; }
  .dim-unknown { background: #fee2e2; } .dim-unknown .dim-label { color: #991b1b; }
  .dim-wonder  { background: #dbeafe; } .dim-wonder .dim-label  { color: #1e40af; }
  .dim-able    { background: #fef9c3; } .dim-able .dim-label    { color: #854d0e; }

  /* 目标列表 */
  .objective-list { list-style: none; }
  .objective-list li {
    padding: 5px 0 5px 16px;
    position: relative;
    font-size: 12.5px;
    color: #374151;
    border-bottom: 1px dashed #e5e7eb;
  }
  .objective-list li:last-child { border-bottom: none; }
  .objective-list li::before {
    content: '✓';
    position: absolute;
    left: 0;
    color: #1a56db;
    font-weight: 700;
  }

  /* 重难点 */
  .kv-row {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 12.5px;
  }
  .kv-label {
    font-weight: 700;
    color: #1a56db;
    white-space: nowrap;
    min-width: 52px;
  }

  /* 教学过程表格 */
  .process-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 11.5px; }
  .process-table th {
    background: #1a56db;
    color: #fff;
    padding: 6px 4px;
    text-align: center;
    font-weight: 600;
    font-size: 11px;
  }
  .process-table td {
    padding: 6px 5px;
    vertical-align: top;
    border-bottom: 1px solid #e5e7eb;
    color: #374151;
  }
  .process-table tr:nth-child(even) td { background: #f0f4ff; }
  .process-table .intent { color: #6b7280; font-style: italic; }

  /* 提问 Q&A */
  .qa-item {
    border-left: 3px solid #1a56db;
    padding: 7px 10px;
    background: #f8faff;
    border-radius: 0 8px 8px 0;
    margin-bottom: 8px;
  }
  .qa-q { font-weight: 700; color: #1a56db; font-size: 12.5px; margin-bottom: 4px; }
  .qa-a { color: #6b7280; font-size: 12px; border-top: 1px dashed #c8d9f7; padding-top: 4px; }

  /* 分层练习 */
  .layer-group { margin-bottom: 8px; }
  .layer-tag {
    display: inline-block;
    border-radius: 20px;
    padding: 1px 10px;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .tag-basic   { background: #dcfce7; color: #166534; }
  .tag-standard{ background: #dbeafe; color: #1e40af; }
  .tag-advanced{ background: #fef9c3; color: #854d0e; }
  .exercise-list { list-style: none; padding-left: 6px; }
  .exercise-list li { padding: 2px 0; font-size: 12px; color: #374151; }
  .exercise-list li::before { content: '• '; color: #9ca3af; }

  /* 空状态 */
  .empty { text-align: center; padding: 40px 20px; color: #9ca3af; font-size: 14px; }
</style>
</head>
<body>

<div id="app"><div class="empty">加载教案中...</div></div>

<script>
function getParam(name) {
  try {
    const val = new URLSearchParams(location.search).get(name);
    return val ? JSON.parse(decodeURIComponent(val)) : null;
  } catch { return null; }
}

function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderLesson(d) {
  let html = '';

  // 封面
  html += `<div class="cover">
    <div class="cover-title">${esc(d['课题信息'] || '教案')}</div>
    ${d['设计思路'] ? `<div style="font-size:11.5px;opacity:.85;margin-top:6px;line-height:1.5">${esc(d['设计思路'].slice(0,100))}${d['设计思路'].length>100?'…':''}</div>` : ''}
  </div>`;

  html += '<div class="body">';

  // 教材分析
  if (d['教材分析']) {
    html += section('📖 教材分析', `<p class="section-text">${esc(d['教材分析'])}</p>`);
  }

  // 学情分析
  if (d['学情分析'] && typeof d['学情分析'] === 'object') {
    const sa = d['学情分析'];
    const dims = [
      ['已知', 'known', '🟢'], ['未知', 'unknown', '🔴'],
      ['想知', 'wonder', '🔵'], ['能知', 'able',   '🟡']
    ];
    let grid = '<div class="grid2">';
    dims.forEach(([key, cls, icon]) => {
      if (sa[key]) grid += `
        <div class="dim-card dim-${cls}">
          <div class="dim-label">${icon} ${key}</div>
          <div>${esc(sa[key])}</div>
        </div>`;
    });
    grid += '</div>';
    html += section('👥 学情分析', grid);
  } else if (d['学情分析']) {
    html += section('👥 学情分析', `<p class="section-text">${esc(d['学情分析'])}</p>`);
  }

  // 教学目标
  if (Array.isArray(d['教学目标']) && d['教学目标'].length) {
    const items = d['教学目标'].map(t => `<li>${esc(t)}</li>`).join('');
    html += section('🎯 教学目标', `<ul class="objective-list">${items}</ul>`);
  }

  // 重难点
  if (d['教学重点'] || d['教学难点']) {
    let kv = '';
    if (d['教学重点']) kv += `<div class="kv-row"><span class="kv-label">📌 重点</span><span>${esc(d['教学重点'])}</span></div>`;
    if (d['教学难点']) kv += `<div class="kv-row"><span class="kv-label">⚡ 难点</span><span>${esc(d['教学难点'])}</span></div>`;
    html += section('重点 & 难点', kv);
  }

  // 教学过程
  if (Array.isArray(d['教学过程']) && d['教学过程'].length) {
    const hasIntent = d['教学过程'].some(s => s['设计意图']);
    let table = `<table class="process-table"><thead><tr>
      <th style="width:14%">环节</th>
      <th style="width:10%">时长</th>
      <th style="width:22%">活动</th>
      <th style="width:22%">教师</th>
      <th style="width:22%">学生</th>
      ${hasIntent ? '<th style="width:10%">意图</th>' : ''}
    </tr></thead><tbody>`;
    d['教学过程'].forEach(s => {
      table += `<tr>
        <td><strong>${esc(s['环节'])}</strong></td>
        <td style="text-align:center;color:#1a56db;font-weight:700">${esc(s['时长'])}</td>
        <td>${esc(s['活动'])}</td>
        <td>${esc(s['教师行为'])}</td>
        <td>${esc(s['学生行为'])}</td>
        ${hasIntent ? `<td class="intent">${esc(s['设计意图']||'')}</td>` : ''}
      </tr>`;
    });
    table += '</tbody></table>';
    html += section('📋 教学过程', table);
  }

  // 提问设计
  if (Array.isArray(d['提问设计']) && d['提问设计'].length) {
    let qa = '';
    d['提问设计'].forEach((q, i) => {
      if (typeof q === 'string') {
        qa += `<div class="qa-item"><div class="qa-q">Q${i+1}：${esc(q)}</div></div>`;
      } else {
        qa += `<div class="qa-item">
          <div class="qa-q">Q${i+1}：${esc(q['问题'])}</div>
          ${q['预设答案'] ? `<div class="qa-a">预设：${esc(q['预设答案'])}</div>` : ''}
        </div>`;
      }
    });
    html += section('💬 提问设计', qa);
  }

  // 分层练习
  if (d['分层练习'] && typeof d['分层练习'] === 'object') {
    const layers = [
      ['基础', 'basic'], ['标准', 'standard'], ['提升', 'advanced']
    ];
    let layerHtml = '';
    layers.forEach(([key, cls]) => {
      const items = d['分层练习'][key];
      if (!items) return;
      const list = (Array.isArray(items) ? items : [items])
        .map(t => `<li>${esc(t)}</li>`).join('');
      layerHtml += `<div class="layer-group">
        <span class="layer-tag tag-${cls}">【${key}层】</span>
        <ul class="exercise-list">${list}</ul>
      </div>`;
    });
    if (layerHtml) html += section('📝 分层练习', layerHtml);
  }

  // 板书、作业、评价、反思
  const fields = [
    ['🖊️ 板书设计', '板书设计'],
    ['📚 作业设计', '作业设计'],
    ['📊 教学评价', '教学评价'],
    ['💡 教学反思', '教学反思建议'],
  ];
  fields.forEach(([label, key]) => {
    if (d[key]) html += section(label, `<p class="section-text">${esc(d[key])}</p>`);
  });

  html += '</div>';
  return html;
}

function section(title, content) {
  return `<div class="section">
    <div class="section-title">${title}</div>
    ${content}
  </div>`;
}

// 主入口
const lesson = getParam('d');
if (lesson) {
  document.getElementById('app').innerHTML = renderLesson(lesson);
} else {
  document.getElementById('app').innerHTML =
    '<div class="empty">⚠️ 未找到教案数据<br><small>请通过 AI 助手生成教案后查看</small></div>';
}
</script>
</body>
</html>
